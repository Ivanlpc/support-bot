services:
  bot:
    image: ${SUPPORT_BOT_IMAGE:?Set SUPPORT_BOT_IMAGE to a tested image tag}
    env_file:
      - /etc/support-bot/runtime.env
    init: true
    restart: 'no'
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    mem_limit: 512m
    extra_hosts:
      - host.docker.internal:host-gateway
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'
