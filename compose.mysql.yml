services:
  bot:
    depends_on:
      db:
        condition: service_healthy
  db:
    image: mysql:8.4
    env_file:
      - /opt/support-bot/mysql.env
    restart: 'no'
    volumes:
      - type: bind
        source: /opt/support-bot/data/mysql
        target: /var/lib/mysql
        bind:
          create_host_path: false
      - ./discordbot.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test:
        [
          CMD-SHELL,
          'MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP --host=127.0.0.1 --user="$${MYSQL_USER}" --execute="SELECT 1" "$${MYSQL_DATABASE}" > /dev/null',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
