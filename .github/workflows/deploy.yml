name: Build and deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-test-only
        ports: [3306:3306]
        options: >-
          --health-cmd="mysql --protocol=TCP --host=127.0.0.1 --user=root --password=ci-test-only --execute='SELECT 1'"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:database
        env:
          TEST_DATABASE_URL: mysql://root:ci-test-only@127.0.0.1:3306/
      - run: npm audit --omit=dev --audit-level=high
      - run: docker build --target test --tag support-bot:test .
      - run: docker build --tag support-bot:check .
      - name: Test release and rollback scripts in a disposable container
        run: docker run --rm --env DEPLOY_TEST_CONTAINER=yes --volume "$PWD:/workspace:ro" --workdir /workspace node:24.22.2-bookworm-slim bash scripts/check-deploy.sh
  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: [self-hosted, linux, support-bot]
    environment: production
    concurrency:
      group: support-bot-production
      cancel-in-progress: false
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Build image and restart through systemd
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: bash deploy/release.sh "$DEPLOY_SHA"
